<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F2A2E"/>
      <stop offset="1" stop-color="#2E5B5E"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5EF2C6" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#7DB8FF" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- Grounded frame (Day-1 baseline: no hardcoded aesthetic themes) -->
  <rect x="0" y="0" width="512" height="512" rx="48" fill="url(#bg)"/>

  <!-- Ambient accent blob (theme-skinning layer) -->
  <g id="themeLayer" opacity="1">
    <path d="M118 338c-20-56 10-126 74-152 68-28 142-10 175 42 34 54 25 125-20 168-49 47-145 58-229-58Z" fill="url(#accent)" filter="url(#soft)" opacity="0.22"/>
  </g>

  <!-- Face -->
  <circle cx="256" cy="240" r="104" fill="#F2C7A5"/>
  <path d="M150 245c18-78 67-123 124-123 63 0 114 46 124 124 4 34-14 54-30 70-18 18-31 34-35 60-1 7-6 12-13 12h-92c-7 0-12-5-13-12-4-26-19-41-35-59-16-18-27-39-25-72Z" fill="#EFB88F" opacity="0.9"/>

  <!-- Hair -->
  <path d="M154 236c0-94 66-150 136-150 78 0 132 61 132 150 0 33-8 57-22 79-10 16-17 32-19 53H195c-2-21-10-37-19-52-15-24-22-48-22-80Z" fill="#2A1B16"/>
  <path d="M190 115c18-16 42-26 69-26 34 0 62 14 83 36-24-8-51-9-83 0-28 8-49 18-69-10Z" fill="#3B2520" opacity="0.85"/>

  <!-- Headphones -->
  <g fill="none" stroke="#B8EEF0" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <path d="M168 246c0-58 42-106 88-106"/>
    <path d="M344 246c0-58-42-106-88-106"/>
  </g>
  <path d="M158 262c-18 0-32 14-32 32v18c0 18 14 32 32 32h10v-82h-10Z" fill="#132528" opacity="0.95"/>
  <path d="M354 262c18 0 32 14 32 32v18c0 18-14 32-32 32h-10v-82h10Z" fill="#132528" opacity="0.95"/>

  <!-- Eyes -->
  <g fill="#1A1413">
    <circle cx="224" cy="238" r="8"/>
    <circle cx="288" cy="238" r="8"/>
    <path d="M216 258c9 11 20 16 32 16s23-5 32-16" stroke="#1A1413" stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Mouth / friendly neutral expression -->
  <path d="M236 300c7 8 16 12 20 12s13-4 20-12" fill="none" stroke="#7A3B3B" stroke-width="6" stroke-linecap="round"/>

  <!-- Brooklyn-ish detail (grounded, not trendy) -->
  <g opacity="0.65">
    <path d="M106 420c38-38 86-58 150-58s112 20 150 58" fill="none" stroke="#B8EEF0" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Theme overlay placeholder (kept for weekly skinning) -->
  <g id="themeOverlay" opacity="1"></g>
</svg>
